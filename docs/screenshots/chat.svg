<text x="22.0" y="193" fill="#7f849c" textLength="320.3" lengthAdjust="spacingAndGlyphs">Type a message, or /help for commands.</text>
<text x="22.0" y="227" fill="#ff5fa2" font-weight="700" textLength="16.9" lengthAdjust="spacingAndGlyphs">❯ </text>
<text x="38.9" y="227" fill="#c8cde8" textLength="295.1" lengthAdjust="spacingAndGlyphs">how much disk space do I have left?</text>
<text x="22.0" y="261" fill="#ff5fa2" textLength="16.9" lengthAdjust="spacingAndGlyphs">● </text>
<text x="38.9" y="261" fill="#c8cde8" font-weight="700" textLength="75.9" lengthAdjust="spacingAndGlyphs">Run df -h</text>
<text x="22.0" y="278" fill="#7f849c" textLength="33.7" lengthAdjust="spacingAndGlyphs">  ⎿ </text>
<text x="55.7" y="278" fill="#7f849c" textLength="59.0" lengthAdjust="spacingAndGlyphs">9 lines</text>
<text x="22.0" y="312" fill="#c8cde8" textLength="177.0" lengthAdjust="spacingAndGlyphs">Your root filesystem </text>
<text x="199.0" y="312" fill="#ff5fa2" font-weight="700" textLength="118.0" lengthAdjust="spacingAndGlyphs">/dev/nvme0n1p2</text>
<text x="317.1" y="312" fill="#c8cde8" textLength="42.1" lengthAdjust="spacingAndGlyphs"> has </text>
<text x="359.2" y="312" fill="#c8cde8" font-weight="700" textLength="92.7" lengthAdjust="spacingAndGlyphs">312 GB free</text>
<text x="451.9" y="312" fill="#c8cde8" textLength="219.2" lengthAdjust="spacingAndGlyphs"> out of 953 GB (67% used).</text>
<text x="22.0" y="346" fill="#ff5fa2" textLength="25.3" lengthAdjust="spacingAndGlyphs"> • </text>
<text x="47.3" y="346" fill="#ff5fa2" font-weight="700" textLength="42.1" lengthAdjust="spacingAndGlyphs">/boot</text>
<text x="89.4" y="346" fill="#c8cde8" textLength="244.5" lengthAdjust="spacingAndGlyphs"> is fine: 812 MB free of 1 GB</text>
<text x="22.0" y="363" fill="#ff5fa2" textLength="25.3" lengthAdjust="spacingAndGlyphs"> • </text>
<text x="47.3" y="363" fill="#c8cde8" textLength="269.8" lengthAdjust="spacingAndGlyphs">Your largest folder is probably </text>
<text x="317.1" y="363" fill="#ff5fa2" font-weight="700" textLength="67.4" lengthAdjust="spacingAndGlyphs">~/.cache</text>
<text x="384.5" y="363" fill="#c8cde8" textLength="134.9" lengthAdjust="spacingAndGlyphs">. Check it with:</text>
<text x="22.0" y="397" fill="#ff5fa2" textLength="151.7" lengthAdjust="spacingAndGlyphs">   du -sh ~/.cache</text>
<text x="22.0" y="431" fill="#7f849c" textLength="244.5" lengthAdjust="spacingAndGlyphs">  4.1s · 96 tokens · 23 tok/s</text>
<text x="22.0" y="465" fill="#ff5fa2" font-weight="700" textLength="16.9" lengthAdjust="spacingAndGlyphs">❯ </text>
<text x="38.9" y="465" fill="#c8cde8" textLength="404.6" lengthAdjust="spacingAndGlyphs">which journalctl option shows logs since a time?</text>
<text x="22.0" y="499" fill="#ff5fa2" textLength="16.9" lengthAdjust="spacingAndGlyphs">● </text>
<text x="38.9" y="499" fill="#c8cde8" font-weight="700" textLength="286.6" lengthAdjust="spacingAndGlyphs">Manual journalctl (find &#x27;--since&#x27;)</text>
<text x="22.0" y="516" fill="#7f849c" textLength="33.7" lengthAdjust="spacingAndGlyphs">  ⎿ </text>
<text x="55.7" y="516" fill="#7f849c" textLength="67.4" lengthAdjust="spacingAndGlyphs">14 lines</text>
<text x="22.0" y="550" fill="#c8cde8" textLength="33.7" lengthAdjust="spacingAndGlyphs">Use </text>
<text x="55.7" y="550" fill="#ff5fa2" font-weight="700" textLength="59.0" lengthAdjust="spacingAndGlyphs">--since</text>
<text x="114.7" y="550" fill="#c8cde8" textLength="16.9" lengthAdjust="spacingAndGlyphs"> (</text>
<text x="131.6" y="550" fill="#ff5fa2" font-weight="700" textLength="16.9" lengthAdjust="spacingAndGlyphs">-S</text>
<text x="148.4" y="550" fill="#c8cde8" textLength="126.4" lengthAdjust="spacingAndGlyphs">), for example </text>
<text x="274.9" y="550" fill="#ff5fa2" font-weight="700" textLength="261.3" lengthAdjust="spacingAndGlyphs">journalctl --since &quot;1 hour ago&quot;</text>
<text x="536.2" y="550" fill="#c8cde8" textLength="8.4" lengthAdjust="spacingAndGlyphs">.</text>
<text x="22.0" y="567" fill="#c8cde8" textLength="168.6" lengthAdjust="spacingAndGlyphs">It takes dates like </text>
<text x="190.6" y="567" fill="#ff5fa2" font-weight="700" textLength="134.9" lengthAdjust="spacingAndGlyphs">2026-11-09 10:00</text>
<text x="325.5" y="567" fill="#c8cde8" textLength="134.9" lengthAdjust="spacingAndGlyphs">, or words like </text>
<text x="460.4" y="567" fill="#ff5fa2" font-weight="700" textLength="75.9" lengthAdjust="spacingAndGlyphs">yesterday</text>
<text x="536.2" y="567" fill="#c8cde8" textLength="42.1" lengthAdjust="spacingAndGlyphs"> and </text>
<text x="578.4" y="567" fill="#ff5fa2" font-weight="700" textLength="42.1" lengthAdjust="spacingAndGlyphs">today</text>
<text x="620.5" y="567" fill="#c8cde8" textLength="8.4" lengthAdjust="spacingAndGlyphs">.</text>
<text x="22.0" y="601" fill="#7f849c" textLength="244.5" lengthAdjust="spacingAndGlyphs">  3.2s · 61 tokens · 22 tok/s</text>
<text x="22.0" y="635" fill="#ff5fa2" font-weight="700" textLength="16.9" lengthAdjust="spacingAndGlyphs">❯ </text>
<text x="38.9" y="635" fill="#ff5fa2" textLength="8.4" lengthAdjust="spacingAndGlyphs">▏</text>
<text x="22.0" y="652" fill="#ff5fa2" textLength="109.6" lengthAdjust="spacingAndGlyphs"> ✦ Qwen3.5 4B</text>
