<g font-family="'JetBrains Mono','JetBrainsMono Nerd Font','DejaVu Sans Mono',monospace" font-size="14" xml:space="preserve">
<text x="22.0" y="57" fill="#ff5fa2" textLength="92.7" lengthAdjust="spacingAndGlyphs">  ┌───────┐</text>
<text x="131.6" y="57" fill="#c8cde8" font-weight="700" textLength="101.2" lengthAdjust="spacingAndGlyphs">padou v0.1.0</text>
<text x="232.7" y="57" fill="#7f849c" textLength="75.9" lengthAdjust="spacingAndGlyphs"> · παντού</text>
<text x="22.0" y="74" fill="#ff5fa2" textLength="33.7" lengthAdjust="spacingAndGlyphs">  │ </text>
<text x="55.7" y="74" fill="#c8cde8" font-weight="700" textLength="16.9" lengthAdjust="spacingAndGlyphs">&gt;_</text>
<text x="89.4" y="74" fill="#ff5fa2" textLength="8.4" lengthAdjust="spacingAndGlyphs">▌</text>
<text x="97.9" y="74" fill="#ff5fa2" textLength="16.9" lengthAdjust="spacingAndGlyphs"> │</text>
<text x="131.6" y="74" fill="#7f849c" textLength="252.9" lengthAdjust="spacingAndGlyphs">Qwen3.5 4B · local · read-only</text>
<text x="22.0" y="91" fill="#ff5fa2" textLength="92.7" lengthAdjust="spacingAndGlyphs">  └──┬─┬──┘</text>
<text x="131.6" y="91" fill="#7f849c" textLength="134.9" lengthAdjust="spacingAndGlyphs">~/Projects/padou</text>
<text x="22.0" y="108" fill="#ff5fa2" textLength="84.3" lengthAdjust="spacingAndGlyphs">   ──┴─┴──</text>
<text x="22.0" y="142" fill="#7f849c" textLength="320.3" lengthAdjust="spacingAndGlyphs">Type a message, or /help for commands.</text>
<text x="22.0" y="176" fill="#ff5fa2" font-weight="700" textLength="16.9" lengthAdjust="spacingAndGlyphs">❯ </text>
<text x="38.9" y="176" fill="#c8cde8" textLength="295.1" lengthAdjust="spacingAndGlyphs">how much disk space do I have left?</text>
<text x="22.0" y="210" fill="#ff5fa2" textLength="16.9" lengthAdjust="spacingAndGlyphs">● </text>
<text x="38.9" y="210" fill="#c8cde8" font-weight="700" textLength="75.9" lengthAdjust="spacingAndGlyphs">Run df -h</text>
<text x="22.0" y="227" fill="#7f849c" textLength="33.7" lengthAdjust="spacingAndGlyphs">  ⎿ </text>
<text x="55.7" y="227" fill="#7f849c" textLength="59.0" lengthAdjust="spacingAndGlyphs">9 lines</text>
<text x="22.0" y="261" fill="#c8cde8" textLength="177.0" lengthAdjust="spacingAndGlyphs">Your root filesystem </text>
<text x="199.0" y="261" fill="#ff5fa2" font-weight="700" textLength="118.0" lengthAdjust="spacingAndGlyphs">/dev/nvme0n1p2</text>
<text x="317.1" y="261" fill="#c8cde8" textLength="42.1" lengthAdjust="spacingAndGlyphs"> has </text>
<text x="359.2" y="261" fill="#c8cde8" font-weight="700" textLength="92.7" lengthAdjust="spacingAndGlyphs">312 GB free</text>
<text x="451.9" y="261" fill="#c8cde8" textLength="219.2" lengthAdjust="spacingAndGlyphs"> out of 953 GB (67% used).</text>
<text x="22.0" y="295" fill="#ff5fa2" textLength="25.3" lengthAdjust="spacingAndGlyphs"> • </text>
<text x="47.3" y="295" fill="#ff5fa2" font-weight="700" textLength="42.1" lengthAdjust="spacingAndGlyphs">/boot</text>
<text x="89.4" y="295" fill="#c8cde8" textLength="244.5" lengthAdjust="spacingAndGlyphs"> is fine: 812 MB free of 1 GB</text>
<text x="22.0" y="312" fill="#ff5fa2" textLength="25.3" lengthAdjust="spacingAndGlyphs"> • </text>
<text x="47.3" y="312" fill="#c8cde8" textLength="269.8" lengthAdjust="spacingAndGlyphs">Your largest folder is probably </text>
<text x="317.1" y="312" fill="#ff5fa2" font-weight="700" textLength="67.4" lengthAdjust="spacingAndGlyphs">~/.cache</text>
<text x="384.5" y="312" fill="#c8cde8" textLength="134.9" lengthAdjust="spacingAndGlyphs">. Check it with:</text>
<text x="22.0" y="346" fill="#ff5fa2" textLength="151.7" lengthAdjust="spacingAndGlyphs">   du -sh ~/.cache</text>
<text x="22.0" y="380" fill="#ff5fa2" font-weight="700" textLength="16.9" lengthAdjust="spacingAndGlyphs">❯ </text>
<text x="38.9" y="380" fill="#c8cde8" textLength="278.2" lengthAdjust="spacingAndGlyphs">why is NetworkManager restarting?</text>
<text x="22.0" y="414" fill="#ff5fa2" textLength="16.9" lengthAdjust="spacingAndGlyphs">● </text>
<text x="38.9" y="414" fill="#c8cde8" font-weight="700" textLength="421.5" lengthAdjust="spacingAndGlyphs">Run journalctl --no-pager -n 100 -u NetworkManager</text>
<text x="22.0" y="431" fill="#7f849c" textLength="33.7" lengthAdjust="spacingAndGlyphs">  ⎿ </text>
<text x="55.7" y="431" fill="#7f849c" textLength="75.9" lengthAdjust="spacingAndGlyphs">101 lines</text>
<text x="22.0" y="465" fill="#c8cde8" textLength="278.2" lengthAdjust="spacingAndGlyphs">It isn&#x27;t crashing: the log shows </text>
<text x="300.2" y="465" fill="#ff5fa2" font-weight="700" textLength="42.1" lengthAdjust="spacingAndGlyphs">wlan0</text>
<text x="342.3" y="465" fill="#c8cde8" textLength="219.2" lengthAdjust="spacingAndGlyphs"> dropping after power-save</text>
<text x="22.0" y="482" fill="#c8cde8" textLength="649.1" lengthAdjust="spacingAndGlyphs">timeouts, then reconnecting. Turning Wi-Fi power saving off usually fixes it.</text>
<text x="22.0" y="516" fill="#ff5fa2" font-weight="700" textLength="16.9" lengthAdjust="spacingAndGlyphs">❯ </text>
<text x="38.9" y="516" fill="#ff5fa2" textLength="8.4" lengthAdjust="spacingAndGlyphs">▏</text>
<text x="22.0" y="533" fill="#ff5fa2" textLength="92.7" lengthAdjust="spacingAndGlyphs"> Qwen3.5 4B</text>
<text x="114.7" y="533" fill="#7f849c" textLength="354.1" lengthAdjust="spacingAndGlyphs"> · 22 tok/s · ctx 1342/8192 (16%) · /help </text>
