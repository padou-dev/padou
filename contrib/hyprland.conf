# Open padou in a floating terminal with Super + A.
# Add these lines to ~/.config/hypr/bindings.conf (Omarchy) or hyprland.conf.
# Swap "alacritty" for your terminal (Omarchy's default is in $terminal).
# Window-rule syntax changes between Hyprland versions: if these rules error,
# copy the style Omarchy itself uses in ~/.local/share/omarchy/default/hypr/.

bindd = SUPER, A, padou, exec, alacritty --class padou -e padou

windowrulev2 = float, class:^(padou)$
windowrulev2 = size 60% 70%, class:^(padou)$
windowrulev2 = center, class:^(padou)$
