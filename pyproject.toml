[project]
name = "padou"
version = "0.2.1"
description = "A private, offline AI assistant for your terminal that knows your machine. Built for small models on laptops."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "p@nos", email = "padou.dev@proton.me" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "prompt-toolkit>=3.0.43",
    "psutil>=5.9",
    "rich>=13.7",
    "send2trash>=1.8.2",
]
keywords = ["ai", "assistant", "cli", "llama.cpp", "ollama", "local-llm", "offline", "terminal", "sysadmin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/padou-dev/padou"
Repository = "https://github.com/padou-dev/padou"
Issues = "https://github.com/padou-dev/padou/issues"
Changelog = "https://github.com/padou-dev/padou/blob/main/CHANGELOG.md"

[project.scripts]
padou = "padou.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["learning", ".github", "docs/screenshots"]

[tool.hatch.build.targets.wheel]
packages = ["src/padou"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
